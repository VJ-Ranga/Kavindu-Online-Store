  <style>
    /* Group A polish: scoped neutral treatment for dynamic product content. */
    .product-page{background:var(--cm-white);}
    .product-crumb{padding-top:32px;}
    .product-main{padding:24px 0 72px;}
    .product-main-image{background:var(--cm-surface);border:0;border-radius:16px;}
    .product-thumb{border-radius:12px;}
    .product-thumb.active{border-color:var(--cm-ink);}
    .product-brand{color:var(--cm-muted);font-weight:500;}
    .product-info h1,.product-cash{font-weight:600;}
    .payment-panel{border-radius:16px;box-shadow:none;}
    .payment-tab{border-radius:12px;}
    .payment-tab.active,.tenure-pills button.active{border-color:var(--cm-ink);color:var(--cm-ink);background:var(--cm-surface);}
    .save-note{color:var(--cm-sale);background:transparent;padding:0;}
    .delivery-box{border-color:var(--cm-line);border-radius:16px;background:var(--cm-surface);}
    .delivery-box select{height:48px;border-color:var(--cm-line);border-radius:12px;}
    .product-tabs-section{padding:64px 0;background:var(--cm-surface);}
    .product-tab{font-weight:500;background:transparent;}
    .product-tab.active{border-color:var(--cm-ink);color:var(--cm-ink);}
    .review{border-radius:16px;}
    .related-section{padding:64px 0;background:var(--cm-white);}
    .related-grid{gap:24px;}
    .lightbox{background:rgba(17,24,39,.72);}
    .product-toast{background:var(--cm-ink);}
    @media (max-width:767.98px){
      .product-main{padding-bottom:40px;}
      .product-tabs-section,.related-section{padding-block:48px;}
      .related-section{padding-bottom:115px;}
    }
  </style>
</head>
