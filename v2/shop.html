<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shop furniture, electronics and home appliances at Kavindu Online Store.">
  <title>Shop products | Kavindu Online Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/css/style.css?v=6" rel="stylesheet">
  <link href="assets/css/pages/shop.css?v=6" rel="stylesheet">
  <style>
    /* Group A polish: keep this page neutral without changing shared styles. */
    .shop-banner.cm-page-banner{min-height:0;padding:40px 0 44px;color:var(--cm-ink);background:var(--cm-surface);}
    .shop-banner.cm-page-banner::before{display:none;}
    .shop-banner.cm-page-banner .shop-breadcrumb{margin-bottom:18px;color:var(--cm-muted);}
    .shop-banner.cm-page-banner .shop-breadcrumb a{color:var(--cm-body);}
    .shop-banner.cm-page-banner .shop-breadcrumb a:hover{color:var(--cm-ink);}
    .shop-banner.cm-page-banner .eyebrow{color:var(--cm-muted);}
    .shop-banner.cm-page-banner p{color:var(--cm-body);}
    .shop-section{background:var(--cm-white);}
    .shop-filters{border:1px solid var(--cm-line);border-radius:16px;background:var(--cm-white);}
    .shop-filters .offcanvas-body{padding:0 20px 20px;}
    .shop-filters .offcanvas-header{padding:20px;}
    .filter-group{padding:18px 0;}
    .price-fields input,.filter-group select{height:48px;border-radius:12px;}
    .shop-toolbar{padding-bottom:18px;border-bottom:1px solid var(--cm-line);}
    .sort-label select,.view-toggle{border-radius:12px;}
    .shop-grid{gap:28px 24px;}
    .shop-empty{border-style:solid;background:var(--cm-surface);}
    .compare-bar{background:var(--cm-ink);box-shadow:none;}
    .cm-modal-panel{box-shadow:0 12px 40px rgba(17,24,39,.12);}
    @media (max-width:767.98px){
      .shop-banner.cm-page-banner{padding:32px 0 36px;}
      .shop-filters{border:0;border-radius:0;}
      .shop-filters .offcanvas-body{padding:0 20px 20px;}
      .shop-grid{gap:24px 16px;}
    }
  </style>
</head>
<body data-page="shop">
  <div id="cm-header"></div>
  <main>
    <section class="shop-banner cm-page-banner">
      <div class="cm-container"><nav class="shop-breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><i class="fa-solid fa-chevron-right"></i><span>Shop</span></nav><span class="eyebrow">Curated for better living</span><h1 id="shop-title">All products</h1><p id="shop-subtitle">Furniture, electronics and appliances selected for everyday life.</p></div>
    </section>
    <section class="section shop-section"><div class="cm-container">
      <div class="shop-mobile-toolbar"><button class="btn-cm btn-cm-outline" type="button" data-bs-toggle="offcanvas" data-bs-target="#shopFilters"><i class="fa-solid fa-sliders"></i> Filters</button><span id="mobile-result-count"></span></div>
      <div class="shop-layout">
        <aside class="shop-filters offcanvas-lg offcanvas-start" tabindex="-1" id="shopFilters" aria-labelledby="filter-title"><div class="offcanvas-header"><h2 id="filter-title">Filter products</h2><button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#shopFilters" aria-label="Close filters"></button></div><div class="offcanvas-body"><div class="filter-heading"><h2>Filter products</h2><button class="filter-reset" type="button" data-reset>Reset</button></div>
          <div class="filter-group"><h3>Categories</h3><div id="category-filters"></div></div>
          <div class="filter-group"><h3>Brand</h3><div id="brand-filters"></div></div>
          <div class="filter-group"><h3>Price range</h3><div class="price-fields"><label>Min<input id="min-price" type="number" min="0" step="1000" inputmode="numeric"></label><label>Max<input id="max-price" type="number" min="0" step="1000" inputmode="numeric"></label></div><input id="price-range" type="range" min="0" max="700000" step="1000" aria-label="Maximum price"></div>
          <div class="filter-group"><label class="check-row"><input id="easy-filter" type="checkbox"><span>Available on Easy Payment</span></label></div>
          <div class="filter-group"><label class="field-label" for="monthly-filter">Max monthly budget</label><select id="monthly-filter"><option value="">Any monthly price</option><option value="5000">Under Rs 5,000/mo</option><option value="10000">Under Rs 10,000/mo</option><option value="20000">Under Rs 20,000/mo</option></select></div>
          <div class="filter-group"><label class="field-label" for="rating-filter">Rating</label><select id="rating-filter"><option value="0">Any rating</option><option value="4.5">4.5 stars & up</option><option value="4">4 stars & up</option><option value="3">3 stars & up</option></select></div>
        </div></aside>
        <div class="shop-results"><div class="shop-toolbar"><p id="result-count" aria-live="polite"></p><div class="shop-toolbar-actions"><label class="sort-label" for="sort-products">Sort by<select id="sort-products"><option value="popular">Popular</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="monthly">Lowest monthly</option><option value="newest">Newest</option></select></label><div class="view-toggle" role="group" aria-label="Product view"><button class="active" type="button" data-view="grid" aria-label="Grid view"><i class="fa-solid fa-grip"></i></button><button type="button" data-view="list" aria-label="List view"><i class="fa-solid fa-list"></i></button></div></div></div><div class="cm-product-grid shop-grid" id="shop-grid"></div><div class="shop-empty" id="shop-empty" hidden><i class="fa-solid fa-magnifying-glass"></i><h2>No products match those filters</h2><p>Try removing a filter or search for another product.</p><button class="btn-cm btn-cm-primary" type="button" data-reset>Reset filters</button></div><button class="btn-cm btn-cm-outline shop-load" id="load-more" type="button">Load more products</button></div>
      </div>
    </div></section>
  </main>
  <div class="compare-bar" id="compare-bar" hidden><div class="cm-container"><div class="compare-items" id="compare-items"></div><span class="compare-count" id="compare-count"></span><button class="btn-cm btn-cm-primary btn-cm-sm" id="open-compare" type="button">Compare</button><button class="compare-clear" id="clear-compare" type="button">Clear</button></div></div>
  <div class="cm-modal" id="compare-modal" hidden role="dialog" aria-modal="true" aria-labelledby="compare-modal-title"><div class="cm-modal-panel"><div class="cm-modal-head"><h2 id="compare-modal-title">Compare products</h2><button type="button" class="cm-modal-close" data-close-compare aria-label="Close comparison"><i class="fa-solid fa-xmark"></i></button></div><div class="compare-table-wrap" id="compare-table"></div></div></div>
  <div id="cm-footer"></div>
  <a class="cm-whatsapp" href="https://wa.me/94771234567" target="_blank" rel="noopener" aria-label="Chat with Kavindu Online Store on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js?v=6"></script>
  <script src="assets/js/app.js?v=6"></script>
  <script src="assets/js/pages/shop.js?v=6"></script>
<script src="../versions.js?v=2" defer></script>
</body>
</html>
