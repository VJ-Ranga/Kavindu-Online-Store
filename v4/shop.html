<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/theme.css?v=13">
<link rel="stylesheet" href="assets/css/shop.css?v=13">
<title>Shop all products | Kavindu Online Store</title>
<meta name="description" content="Browse furniture, refrigerators, washing machines, air conditioners, TVs and laptops. Filter by price, brand and Easy Payment monthly amount.">
</head>
<body class="woocommerce woocommerce-page post-type-archive post-type-archive-product archive woocommerce-shop">
<div id="site-header"></div>
<main id="primary" tabindex="-1">
<div class="woocommerce">
<div class="breadcrumb-wrap"><div class="container"><nav class="woocommerce-breadcrumb" id="shop-crumb" aria-label="Breadcrumb"></nav></div></div>
<div class="container shop-wrap">
  <header class="woocommerce-products-header">
    <h1 class="woocommerce-products-header__title page-title" id="shop-title">Shop</h1>
    <p class="term-description" id="shop-desc"></p>
  </header>
  <div class="woocommerce-notices-wrapper"></div>
  <div class="shop-layout">
    <aside class="shop-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="shop-filters" aria-labelledby="filters-h">
      <div class="offcanvas-header"><h2 class="h5 m-0" id="filters-h">Filters</h2><button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#shop-filters" aria-label="Close filters"></button></div>
      <div class="offcanvas-body"><form id="filter-form" class="filters" autocomplete="off"></form></div>
      <div class="offcanvas-footer d-lg-none"><button type="button" class="button alt" data-bs-dismiss="offcanvas" data-bs-target="#shop-filters" id="filters-show">Show <span id="filters-count">0</span> products</button></div>
    </aside>
    <div class="shop-main">
      <div class="shop-toolbar">
        <button type="button" class="btn-kv btn-kv-outline filter-toggle d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#shop-filters" aria-controls="shop-filters"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Filters <span class="filter-n" id="filter-n" hidden></span></button>
        <p class="woocommerce-result-count" id="result-count" role="status"></p>
        <form class="woocommerce-ordering" method="get" onsubmit="return false">
          <label class="screen-reader-text" for="orderby">Sort products</label>
          <select name="orderby" id="orderby" class="orderby">
            <option value="menu_order">Default sorting</option><option value="popularity">Sort by popularity</option>
            <option value="rating">Sort by average rating</option><option value="date">Sort by latest</option>
            <option value="price">Sort by price: low to high</option><option value="price-desc">Sort by price: high to low</option>
          </select>
        </form>
        <div class="per-page"><label for="perpage">Show</label><select id="perpage"><option>12</option><option>24</option><option>36</option></select></div>
        <div class="view-toggle" role="group" aria-label="Product view">
          <button type="button" class="kv-chip on" data-view="grid" aria-pressed="true" aria-label="Grid view"><i class="fa-solid fa-table-cells" aria-hidden="true"></i></button>
          <button type="button" class="kv-chip" data-view="list" aria-pressed="false" aria-label="List view"><i class="fa-solid fa-list" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="active-filters" id="active-filters"></div>
      <div id="shop-loop"></div>
      <nav class="woocommerce-pagination" id="shop-pages" aria-label="Product pagination"></nav>
    </div>
  </div>
</div>
</div>
</main>
<div id="site-footer"></div>
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="assets/js/data.js?v=13"></script>
<script defer src="assets/js/theme.js?v=13"></script>
<script defer src="assets/js/shop.js?v=13"></script>
</body>
</html>
